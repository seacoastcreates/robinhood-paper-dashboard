[build]
  publish = "public"
  functions = "netlify/functions"
  # The hourly job commits only data/. Those commits don't need a redeploy,
  # because the site reads data/ from GitHub at request time.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)data'"

[[redirects]]
  from = "/api/state"
  to = "/.netlify/functions/state"
  status = 200
